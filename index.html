<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FSP Audio — Birleşik Liste</title>

  <meta name="description" content="FSP Audio — Birleşik kayıt listesi ve oynatıcı (S1+S2+S3). CC altyazı + TXT transkript." />
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    :root{
      --capLines: 6;
      --border:#e9e9e9;
      --muted:#6b6b6b;
      --bg:#ffffff;
      --hover:#f7f7f7;

      --active:#cfe9ff;
      --activeGlow: 0 0 0 2px rgba(43,124,255,.34) inset, 0 12px 26px rgba(43,124,255,.14);

      --blue:#2b7cff;
      --blueGlow: 0 0 0 4px rgba(43,124,255,.24), 0 10px 22px rgba(43,124,255,.10);

      --orange:#f59e0b;
      --orangeGlow: 0 0 0 4px rgba(245,158,11,.20), 0 10px 22px rgba(245,158,11,.10);
    }

    html, body{
      height: 100%;
      overscroll-behavior-y: none;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body{
      margin: 0;
      overflow: visible;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:#111;
      line-height: 1.10;
    }

    #scrollArea{
      height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 18px;
      max-width: 980px;
      margin: 0 auto;
    }

    #appScale{
      transform-origin: top left;
      will-change: transform;
    }

    .pageTitle{
      font-size: 1.7rem;
      font-weight: 800;
      color: #0b5fff;
      background: #f1f5ff;
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      display: flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
    }

    .navRow{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap: wrap;
      margin: 0 0 12px 0;
    }
    .navLink{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      color:#111;
      text-decoration:none;
      font-size: .95rem;
      line-height: 1;
      user-select:none;
      transition: background .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .navLink:hover{ background: var(--hover); }
    .navLink.on{
      border-color:var(--blue);
      background: rgba(43,124,255,.10);
      box-shadow: 0 0 0 3px rgba(43,124,255,.16) inset;
    }

    .topbar{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    #stickyBar{
      position: sticky;
      top: 0;
      z-index: 1200;
      background: var(--bg);
      padding: 10px 0;
      border-radius: 16px;
      box-shadow:
        0 1px 0 rgba(0,0,0,.06),
        0 10px 18px rgba(0,0,0,.05);
    }
    #stickyBar.docked{
      position: fixed;
      z-index: 1200;
      padding: 10px 0;
      border-radius: 16px;
      box-shadow:
        0 1px 0 rgba(0,0,0,.06),
        0 14px 28px rgba(0,0,0,.10);
    }
    #stickyBarPh{ height: 0; }

    #search{
      flex: 1 1 520px;
      min-width: 220px;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #d8d8d8;
      border-radius: 16px;
      font-size: 1.05rem;
      outline: none;
    }

    #resetBtn{
      height: 46px;
      padding: 0 16px;
      border: 1px solid #d8d8d8;
      border-radius: 16px;
      background: white;
      cursor: pointer;
      font-size: 1rem;
      flex: 0 0 auto;
    }
    #resetBtn:hover{ background: var(--hover); }

    .zoomWrap{
      display:flex;
      align-items:center;
      gap: 24px;
      margin-left: 14px;
      padding: 6px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      background: white;
      user-select:none;
      flex: 0 0 auto;
    }
    .zoomBtn{
      height: 36px;
      width: 48px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease, filter .15s ease;
    }
    .zoomBtn:hover{ background: var(--hover); }
    .zoomBtn:disabled{ opacity: .35; cursor: default; }
    .zoomBtn svg{
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .95;
    }
    .zoomBtn.zoomOut, .zoomBtn.zoomIn{ opacity: .55; }
    .zoomBtn.enabled.zoomOut{
      opacity: 1;
      background: rgba(255, 149, 0, .18);
      border-color: rgba(255, 149, 0, .70);
      box-shadow: 0 0 0 3px rgba(255, 149, 0, .16) inset, 0 8px 18px rgba(255, 149, 0, .12);
      color: #b45309;
    }
    .zoomBtn.enabled.zoomIn{
      opacity: 1;
      background: rgba(34, 197, 94, .18);
      border-color: rgba(34, 197, 94, .70);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, .16) inset, 0 8px 18px rgba(34, 197, 94, .12);
      color: #15803d;
    }

    #meta{
      color: var(--muted);
      font-size: .95rem;
      margin: 6px 0 12px 2px;
      line-height: 1.05;
    }

    .headerRow, .itemRow{
      display: grid;
      grid-template-columns: minmax(0, 1fr) 8ch 54px 36px 36px 54px;
      align-items: center;
      column-gap: 8px;
    }
    .headerRow{
      padding: 6px 8px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.05;
    }
    .titleHead, .durHead{
      display:flex;
      align-items:center;
      gap:8px;
      user-select:none;
      width: 100%;
    }
    .titleHead{ justify-content:flex-start; }
    .durHead{ justify-content:flex-end; }

    .headIconCell{
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
    }

    .sortBtn{
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color:#111;
      flex: 0 0 auto;
      position: relative;
    }
    .sortBtn:hover{ background: var(--hover); }
    .sortBtn.on{
      border-color:var(--blue);
      box-shadow: 0 0 0 3px rgba(43,124,255,.12) inset;
    }
    .sortBtn svg{ width: 20px; height: 20px; display: block; }
    .sortBtn .mainIcon{ width: 20px; height: 20px; }
    .sortBtn .dirIcon{
      position: absolute;
      right: 4px;
      bottom: 2px;
      width: 12px;
      height: 12px;
      opacity: .95;
    }

    .iconOrange{ fill: var(--orange); }
    .iconBlue{ fill: var(--blue); }

    #list{ border-bottom: 1px solid var(--border); }

    .itemRow{
      padding: 4px 8px;
      border-bottom: 1px solid #ececec;
      cursor: pointer;
      background: #f7f7f7;
    }
    #list .itemRow:nth-child(even){ background: #eeeeee; }
    .itemRow:hover{ background: var(--hover); }
    .itemRow.active{
      background: var(--active) !important;
      box-shadow: var(--activeGlow);
      position: relative;
    }
    .itemRow.active::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:4px;
      background: var(--blue);
      border-radius: 4px;
    }

    .title{ font-size: 1.02rem; font-weight: 500; line-height: 1.02; min-width: 0; }
    .dur{ text-align:right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .95rem; user-select:none; white-space: nowrap; line-height: 1.00; }
    .countCell{ text-align: right; color: #404040; font-variant-numeric: tabular-nums; font-size: .92rem; user-select:none; white-space: nowrap; line-height: 1.00; padding-right: 2px; }

    @media (max-width: 680px){
      #scrollArea{ padding: 14px; }
      .headerRow, .itemRow{ grid-template-columns: minmax(0, 1fr) 8ch 46px 34px 34px 46px; }
      .title{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #search{ flex: 1 1 100%; }
      .zoomWrap{ margin-left: 0; }
    }

    .iconBtn{
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor: pointer;
      user-select:none;
      transition: box-shadow .15s ease, border-color .15s ease, background .15s ease, opacity .15s ease;
      justify-self: center;
      -webkit-tap-highlight-color: transparent;
    }
    .iconBtn:hover{ background: var(--hover); }
    .iconBtn:disabled{ opacity: .35; cursor: default; }
    .iconBtn.on{
      border-color: var(--blue);
      background: rgba(43,124,255,.10);
      box-shadow: var(--blueGlow);
    }
    .iconBtn svg{ width: 14px; height: 14px; opacity: .9; }

    .filterBtn{
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color:#111;
    }
    .filterBtn:hover{ background: var(--hover); }
    .filterBtn.on{
      border-color:var(--blue);
      box-shadow: 0 0 0 3px rgba(43,124,255,.12) inset;
    }
    .filterBtn svg{ width:14px; height:14px; }

    #floatingPlayer{
      position: fixed;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(720px, calc(100vw - 36px));
      background: white;
      border: 1.5px solid #d6d6d6;
      border-right-color: #bdbdbd;
      border-bottom-color:#b3b3b3;
      border-radius: 18px;
      box-shadow:
        10px 34px 86px rgba(0,0,0,.20),
        4px 14px 30px rgba(0,0,0,.10),
        0px 2px 6px rgba(0,0,0,.06);
      overflow: visible;
      z-index: 9999;
      transform-origin: top left;
      will-change: transform;
      transition: opacity .18s ease;
      touch-action: none;
    }
    #floatingPlayer.hiddenWhileTyping{ opacity: .35; }

    #fpHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px 12px;
      background: #fbfbfb;
      cursor: grab;
      user-select:none;
      gap: 10px;
      touch-action: none;
      line-height: 1.05;
      position: relative;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.85),
        inset 0 -1px 0 rgba(0,0,0,.04);
    }
    #fpHeader::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height: 2px;
      background: linear-gradient(to bottom, rgba(0,0,0,.18), rgba(255,255,255,.80));
    }

    #fpTitle{
      font-weight: 650;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
      min-width: 0;
      line-height: 1.12;
    }

    #fpHeaderRight{
      display:flex;
      align-items:center;
      gap: 8px;
      flex: 0 0 auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .miniBtn{
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .miniBtn:hover{ background: var(--hover); }
    .miniBtn svg{ width:16px; height:16px; }

    .speedWrap{
      display:flex;
      align-items:center;
      gap: 6px;
      padding: 4px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      background: white;
      user-select:none;
    }
    .speedCtlBtn{
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      cursor: pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 18px;
      line-height: 1;
    }
    .speedCtlBtn:hover{ background: var(--hover); }

    .speedValue{
      min-width: 56px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      padding: 0 10px;
      cursor: default;
    }
    .speedValue.on{
      border-color:var(--blue);
      box-shadow: 0 0 0 3px rgba(43,124,255,.12) inset;
    }

    #fpBody{ padding: 10px 12px 12px 12px; box-shadow: inset 0 1px 0 rgba(0,0,0,.05); }
    #status{ margin: 8px 2px 0 2px; color: var(--muted); font-size: .92rem; line-height: 1.05; }

    #captionsDock{ position:absolute; left:0; right:0; bottom:100%; transform: translateY(12px); pointer-events:none; z-index:10000; }
    #captions{
      pointer-events:auto;
      margin:0;
      padding:10px 12px;
      padding-bottom: calc(10px + .55em);
      border-radius:12px;
      border: 2px solid #d3d3d3;
      background:#fafafa;
      white-space: pre-wrap;
      line-height: 1.25;
      font-size: 1.02rem;
      overflow:hidden;
      max-height: calc(1.25em * var(--capLines) + 34px);
      box-shadow: 0 10px 22px rgba(0,0,0,.06);
      cursor:pointer;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }
    #captions.isEmpty{ color: var(--muted); cursor: default; }
    #captions.hidden{ display:none; }

    .ccModeBtn{ width:auto; min-width:42px; padding:0 10px; border-color: var(--blue); border-radius:12px; }
    .ccModeBtn .btnMark{ font-weight: 850; font-size: 16px; letter-spacing:.3px; line-height:1; }
    .ccModeBtn.on{ border-color: var(--blue); background: rgba(43,124,255,.10); box-shadow: 0 0 0 3px rgba(43,124,255,.12) inset; }
    .ccModeBtn.on .btnMark{ color: var(--orange); }
    .ccModeBtn:not(.on) .btnMark{ color:#404040; }

    #fpTxtBtn{
      width:auto;
      min-width:56px;
      padding:0 12px;
      border-radius:12px;
      border:1px solid rgba(245,158,11,.55);
      background: rgba(245,158,11,.10);
      box-shadow: 0 0 0 3px rgba(245,158,11,.10) inset;
    }
    #fpTxtBtn .btnMark{ font-weight:900; letter-spacing:.5px; font-size:16px; color:#b45309; line-height:1; }
    #fpTxtBtn.on{ border-color: rgba(43,124,255,.70); background: rgba(43,124,255,.12); box-shadow: var(--blueGlow); }
    #fpTxtBtn.on .btnMark{ color:#0b5fff; }

    .diseaseName{ color: #c2410c; font-weight: 650; }

    /* Transcript popup */
    #txPanel{
      position: fixed;
      z-index: 10050;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: min(960px, calc(100vw - 28px));
      height: min(82vh, 860px);
      background: #fff;
      border: 1.5px solid #d6d6d6;
      border-right-color: #bdbdbd;
      border-bottom-color:#b3b3b3;
      border-radius: 18px;
      box-shadow: 10px 34px 86px rgba(0,0,0,.20), 4px 14px 30px rgba(0,0,0,.10), 0px 2px 6px rgba(0,0,0,.06);
      overflow: hidden;
      display: none;
      flex-direction: column;
      touch-action: none;
    }
    #txPanel.open{ display:flex; }

    #txHeader{
      padding: 10px 12px;
      background: #fbfbfb;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      cursor: grab;
      user-select:none;
      touch-action: none;
      border-bottom: 1px solid #ececec;
      line-height: 1.05;
    }
    #txTitle{
      font-weight: 650;
      font-size: .98rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
      min-width: 0;
    }
    #txBtns{
      display:flex;
      gap: 8px;
      flex: 0 0 auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .txBtn{
      height: 36px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      background: white;
      cursor: pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      font-weight: 650;
      font-size: .92rem;
      user-select:none;
      line-height: 1;
      white-space: nowrap;
    }
    .txBtn:hover{ background: var(--hover); }
    .txBtn:disabled{ opacity: .45; cursor: default; }
    .txBtn svg{ width: 16px; height: 16px; }

    #txBody{
      padding: 10px 12px 12px 12px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      flex: 1 1 auto;
      background:#fff;
    }
    #txInfo{
      color: var(--muted);
      font-size: .92rem;
      margin: 0 0 8px 0;
      line-height: 1.05;
    }
    #txSearchRow{
      display:none;
      gap: 8px;
      align-items:center;
      margin: 0 0 10px 0;
      padding: 8px;
      border: 1px solid #e2e2e2;
      border-radius: 14px;
      background:#fff;
      position: sticky;
      top: 0;
      z-index: 3;
    }
    #txSearchRow.on{ display:flex; }
    #txSearchInput{
      flex: 1 1 auto;
      min-width: 140px;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      font-size: 1.05rem;
      outline: none;
    }
    .txNavBtn{
      width: 60px;
      height: 46px;
      border-radius: 14px;
      border: 1px solid #d8d8d8;
      background: white;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      font-weight: 900;
      font-size: 32px;
      line-height: 1;
    }
    .txNavBtn:hover{ background: var(--hover); }
    .txNavBtn:disabled{ opacity:.45; cursor: default; }
    #txMatchCount{
      min-width: 98px;
      text-align: right;
      color: #404040;
      font-variant-numeric: tabular-nums;
      font-size: .92rem;
      user-select:none;
    }
    #txContent{
      white-space: pre-wrap;
      word-break: break-word;
      font-variant-numeric: tabular-nums;
      line-height: 1.35;
      font-size: .92rem;
      margin: 0;
    }
    .txMark{
      background: rgba(43,124,255,.22);
      border-radius: 6px;
      padding: 0 2px;
    }
    .txMark.active{
      background: rgba(245,158,11,.35);
      box-shadow: 0 0 0 2px rgba(245,158,11,.20);
    }
    #txResizeHandle{
      position:absolute;
      left: 0;
      bottom: 0;
      width: 54px;
      height: 54px;
      cursor: nwse-resize;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      touch-action: none;
      background: linear-gradient(135deg, rgba(43,124,255,.0), rgba(43,124,255,.18));
      border-top: 1px solid #e2e2e2;
      border-right: 1px solid #e2e2e2;
      border-top-right-radius: 18px;
    }
    #txResizeHandle svg{ width:22px; height:22px; opacity:.88; }
  </style>
</head>

<body>
  <div id="scrollArea">
    <div id="appScale">
      <div class="pageTitle"><span>FSP Audio — Birleşik Liste</span></div>

      <nav class="navRow" aria-label="Sayfalar">
        <a class="navLink" href="https://protokolfsp.github.io/fsp-audio/">Güncel</a>
        <a class="navLink" href="https://protokolfsp.github.io/FSP2022-23/">2021–23</a>
        <a class="navLink" href="https://protokolfsp.github.io/All-in-One/">All-in-One</a>
        <a class="navLink" href="https://protokolfsp.github.io/Tlcfsp/">TLC</a>
        <a class="navLink" href="https://protokolfsp.github.io/MenschiB/">MenschiB</a>
      </nav>

      <div id="stickyBar">
        <div class="topbar">
          <input id="search" type="text" placeholder="Arama (ör. ACS, DM, PAVK)..." />
          <button id="resetBtn" type="button">Hepsi</button>

          <div class="zoomWrap" aria-label="Görünüm">
            <button id="zoomOutBtn" class="zoomBtn zoomOut" type="button" aria-label="Küçült">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6"></circle>
                <path d="M20 20l-3.5-3.5"></path>
                <path d="M8.5 11h5"></path>
              </svg>
            </button>

            <button id="zoomInBtn" class="zoomBtn zoomIn" type="button" aria-label="Büyüt">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6"></circle>
                <path d="M20 20l-3.5-3.5"></path>
                <path d="M11 8.5v5"></path>
                <path d="M8.5 11h5"></path>
              </svg>
            </button>
          </div>
        </div>

        <div id="meta">Görünən: 0 / Toplam: 0</div>

        <div class="headerRow">
          <div class="colTitle">
            <div class="titleHead">
              <span>Kayıt</span>
              <button id="sortDateBtn" class="sortBtn" type="button" title="Tarihe göre sırala (dosya sonu)">

    // ====== STORAGE ======

    };

    const loadMap = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch { return {}; } };
    const saveMap = (k, v) => localStorage.setItem(k, JSON.stringify(v));
    const loadAny = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
    const saveAny = (k, v) => localStorage.setItem(k, JSON.stringify(v));

    let favs = loadMap(LS.favs);
    let durs = loadMap(LS.durs);
    let filterFav = false;

    let items = [];
    let activeId = null;
    let selectedId = null;

    // ====== helpers ======
    function escHtml(s){
      return (s ?? "").toString()
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
    }
    function foldTR(s){
      s = (s || "").toString();
      s = s.toLocaleLowerCase("tr");
      s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      s = s.replace(/ı/g, "i");
      s = s.replace(/\s+/g, " ").trim();
      return s;
    }
    function decodeURIComponentSafe(s){ try { return decodeURIComponent(s); } catch { return s; } }
    function highlightDisease(title){
      const raw = (title ?? "").toString();
      const m = raw.match(/\b(dr|fr)\b\.?/i);
      if (!m || m.index == null) return escHtml(raw);
      const i = m.index;
      const leftRaw = raw.slice(0, i);
      const leftTrim = leftRaw.trimEnd();
      if (!leftTrim.trim()) return escHtml(raw);
      const trailing = leftRaw.slice(leftTrim.length);
      return `<span class="diseaseName">${escHtml(leftTrim)}</span>${escHtml(trailing)}${escHtml(raw.slice(i))}`;
    }
    function guessMime(url){
      try{
        const p = new URL(url).pathname.toLowerCase();
        if (p.endsWith(".mp3")) return "audio/mpeg";
        if (p.endsWith(".m4a")) return "audio/mp4";
      }catch{}
      return "audio/*";
    }
    function fmtDur(sec){
      if (!Number.isFinite(sec) || sec <= 0) return "—";
      sec = Math.round(sec);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");
      if (h > 0) return `${h}:${mm}:${ss}`;
      return `${m}:${ss}`;
    }

    function ia3IsBlockedByPrefix(fileName){
      let base = (fileName || "").toString();
      base = base.split("/").pop() || base;
      base = decodeURIComponentSafe(base);
      base = base.replace(/\.(m4a|mp3)$/i, "").trim();
      base = base.replace(/^A[\s_-]+/i, "").trim();
      const folded = foldTR(base);
      for (const p of IA3_BLOCK_PREFIXES){
        const c = foldTR(p);
        if (!c) continue;
        if (folded.startsWith(c)){
          const next = folded.slice(c.length, c.length + 1);
          if (!next || /[\s\-_0-9.:]/.test(next)) return true;
        }
      }
      return false;
    }

    function parseEndDate(item){
      const raw0 = (item.name || item.file || item.title || "").toString();
      let s;
      try { s = decodeURIComponent(raw0.split("/").pop() || raw0); } catch { s = raw0; }
      s = s.replace(/\.(mp3|m4a|wav|aac|ogg|flac)$/i, "").trim();
      s = s.normalize("NFKC").replace(/\u00A0/g, " ").trim();
      s = s.trim().replace(/[)\]\s]+$/g, "").trim();
      const m = s.match(/(\d{1,2})[.\-_\u00B7](\d{1,2})[.\-_\u00B7](\d{2}|\d{4})\s*$/);
      if (!m) return null;
      const dd = Number(m[1]);
      const mm = Number(m[2]);
      let yy = Number(m[3]);
      if (yy < 100) yy = 2000 + yy;
      if (!(dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12)) return null;
      const t = Date.UTC(yy, mm - 1, dd);
      if (!Number.isFinite(t)) return null;
      const d = new Date(t);
      if (d.getUTCFullYear() !== yy || (d.getUTCMonth() + 1) !== mm || d.getUTCDate() !== dd) return null;
      return t;
    }

    function chunk(arr, size){
      const out = [];
      for (let i=0; i<arr.length; i+=size) out.push(arr.slice(i, i+size));
      return out;
    }

    // ====== counters ======
    let globalPlayCounts = {};
    let globalDownloadCounts = {};

    async function fetchCounts(type, ids){
      if (!ids.length) return {};
      try{
        const res = await fetch(COUNTER_API + "/counts", {
          method: "POST",
          mode: "cors",
          cache: "no-store",
          headers: { "content-type": IS_SAFARI ? "text/plain;charset=utf-8" : "application/json" },
          body: JSON.stringify({ type, ids })
        });
        if (!res.ok) throw new Error("counts failed");
        const j = await res.json();
        return (j && j.counts) ? j.counts : {};
      }catch{
        return {};
      }
    }

    let refreshCountsTimer = null;
    function scheduleRefreshCounts(ms = 800){
      clearTimeout(refreshCountsTimer);
      refreshCountsTimer = setTimeout(() => refreshAllCounts().catch(()=>{}), ms);
    }

    async function refreshAllCounts(){
      if (!items.length) return;
      const ids = items.map(it => it.id);
      const parts = chunk(ids, 200);
      const playAll = {};
      const dlAll = {};

      for (const part of parts){
        const [p, d] = await Promise.all([fetchCounts("play", part), fetchCounts("download", part)]);
        Object.assign(playAll, p);
        Object.assign(dlAll, d);
      }
      if (Object.keys(playAll).length) globalPlayCounts = playAll;
      if (Object.keys(dlAll).length) globalDownloadCounts = dlAll;
      render();
    }

    function sendHit(type, it){
      try{
        const payload = { type, id: it?.id || "", title: it?.title || "", file_name: (it?.name || "").split("/").pop() || "" };
        const url = COUNTER_API + "/hit";
        const data = JSON.stringify(payload);

        if (IS_SAFARI && navigator.sendBeacon){
          const ok = navigator.sendBeacon(url, new Blob([data], { type: "text/plain;charset=utf-8" }));
          if (ok) return;
        }
        fetch(url, {
          method: "POST",
          mode: "cors",
          cache: "no-store",
          keepalive: true,
          headers: { "content-type": IS_SAFARI ? "text/plain;charset=utf-8" : "application/json" },
          body: data
        }).catch(() => {});
      }catch{}
    }

    function bumpLocalGlobalCount(type, id){
      if (!id) return;
      if (type === "play") globalPlayCounts[id] = (Number(globalPlayCounts[id]) || 0) + 1;
      else globalDownloadCounts[id] = (Number(globalDownloadCounts[id]) || 0) + 1;
    }

    let playGate = { id: null, armed: false, sent: false };
    function armPlayGate(it){ playGate = { id: it?.id || null, armed: true, sent: false }; }
    function trySendPlayOnPlaying(){
      if (!playGate.armed || playGate.sent || !playGate.id) return;
      if (!playerEl || playerEl.paused) return;
      playGate.sent = true;
      const it = items.find(x => x.id === playGate.id) || { id: playGate.id, title:"", name:"" };
      bumpLocalGlobalCount("play", it.id);
      sendHit("play", it);
      scheduleRefreshCounts(1200);
      render();
    }
    playerEl.addEventListener("playing", trySendPlayOnPlaying);

    // ====== sort state ======
    const ALLOWED_SORT = new Set(["title","date","dur","play","download"]);
    let sortMode = localStorage.getItem(LS.sortMode) || "date";
    if (!ALLOWED_SORT.has(sortMode)) sortMode = "date";
    let durSortDir  = (localStorage.getItem(LS.sortDirDur) === "desc") ? "desc" : "asc";
    let dateSortDir = (localStorage.getItem(LS.sortDirDate) === "asc") ? "asc" : "desc";
    let playSortDir = (localStorage.getItem(LS.sortDirPlay) === "asc") ? "asc" : "desc";
    let dlSortDir   = (localStorage.getItem(LS.sortDirDl) === "asc") ? "asc" : "desc";

    // ====== speed ======
    const SPEEDS = [0.5, 0.75, 0.9, 1, 1.25, 1.5, 1.75, 2.0, 2.25];
    let speedIndex = SPEEDS.indexOf(1);
    function fmtSpeed(v){ return (Math.round(v * 100) / 100).toString().replace(/\.0+$/,"") + "×"; }
    function setSpeedUI(v){
      speedValueEl.textContent = fmtSpeed(v);
      speedValueEl.classList.add("on");
      slowBtn.disabled = (speedIndex <= 0);
      fastBtn.disabled = (speedIndex >= SPEEDS.length - 1);
      slowBtn.style.opacity = slowBtn.disabled ? 0.45 : 1;
      fastBtn.style.opacity = fastBtn.disabled ? 0.45 : 1;
    }
    function applySpeedByIndex(idx){
      speedIndex = Math.max(0, Math.min(SPEEDS.length - 1, idx));
      const v = SPEEDS[speedIndex];
      plyr.speed = v;
      localStorage.setItem(LS.speed, String(v));
      setSpeedUI(v);
    }
    function restoreSpeed(){
      const saved = Number(localStorage.getItem(LS.speed) || "1");
      if (Number.isFinite(saved)){
        const i = SPEEDS.findIndex(x => Math.abs(x - saved) < 0.001);
        applySpeedByIndex(i === -1 ? SPEEDS.indexOf(1) : i);
      } else {
        applySpeedByIndex(SPEEDS.indexOf(1));
      }
    }
    slowBtn.addEventListener("click", (e) => { e.stopPropagation(); applySpeedByIndex(speedIndex - 1); });
    fastBtn.addEventListener("click", (e) => { e.stopPropagation(); applySpeedByIndex(speedIndex + 1); });

    // ====== zoom ======
    const ZOOMS = [0.85, 0.9, 0.95, 1, 1.05, 1.1, 1.15, 1.2];
    let zoomIndex = ZOOMS.indexOf(1);
    let uiScale = 1;
    let useTransformScale = false;

    function getViewportWH(){
      const vv = window.visualViewport;
      const vw = (vv && vv.width)  ? vv.width  : window.innerWidth;
      const vh = (vv && vv.height) ? vv.height : window.innerHeight;
      return { vw, vh };
    }
    function toLayoutPx(v){ return useTransformScale ? (v / uiScale) : v; }

    function setZoomUI(){
      zoomOutBtn.disabled = (zoomIndex <= 0);
      zoomInBtn.disabled  = (zoomIndex >= ZOOMS.length - 1);
      zoomOutBtn.classList.toggle("enabled", !zoomOutBtn.disabled);
      zoomInBtn.classList.toggle("enabled", !zoomInBtn.disabled);
    }

    function applyZoomByIndex(idx){
      zoomIndex = Math.max(0, Math.min(ZOOMS.length - 1, idx));
      const v = ZOOMS[zoomIndex];
      uiScale = v;
      useTransformScale = !(window.CSS && CSS.supports && CSS.supports("zoom", "1"));

      if (!useTransformScale){
        document.documentElement.style.zoom = String(v);
        appScaleEl.style.transform = "";
        fp.style.transform = "";
      } else {
        document.documentElement.style.zoom = "";
        appScaleEl.style.transform = `scale(${v})`;
        fp.style.transform = `scale(${v})`;
      }

      localStorage.setItem(LS.zoom, String(v));
      setZoomUI();
      setTimeout(() => { clampPlayerToViewport(); updateSticky(true); }, 0);
    }

    function restoreZoom(){
      const saved = Number(localStorage.getItem(LS.zoom) || "1");
      if (Number.isFinite(saved)){
        const i = ZOOMS.findIndex(x => Math.abs(x - saved) < 0.001);
        applyZoomByIndex(i === -1 ? ZOOMS.indexOf(1) : i);
      } else {
        applyZoomByIndex(ZOOMS.indexOf(1));
      }
    }

    zoomOutBtn.addEventListener("click", (e) => { e.stopPropagation(); applyZoomByIndex(zoomIndex - 1); });
    zoomInBtn.addEventListener("click", (e) => { e.stopPropagation(); applyZoomByIndex(zoomIndex + 1); });

    // ====== sticky docking ======
    let stickyStartTop = null;
    let stickyDocked = false;
    let stickyHomeParent = null;

    function measureStickyStartTop(){
      if (!stickyBar) return;
      if (stickyDocked) return;
      const barRect = stickyBar.getBoundingClientRect();
      const scRect  = scrollArea.getBoundingClientRect();
      stickyStartTop = (barRect.top - scRect.top) + scrollArea.scrollTop;
    }

    function getScrollAreaPadding(){
      const cs = getComputedStyle(scrollArea);
      const pt = parseFloat(cs.paddingTop) || 0;
      const pl = parseFloat(cs.paddingLeft) || 0;
      const pr = parseFloat(cs.paddingRight) || 0;
      return { pt, pl, pr };
    }

    function dockStickyBar(){
      if (stickyDocked) return;
      stickyDocked = true;
      stickyHomeParent = stickyBar.parentNode;
      stickyPh.style.height = stickyBar.offsetHeight + "px";
      stickyBar.classList.add("docked");
      document.body.appendChild(stickyBar);
      positionDockedStickyBar();
    }

    function undockStickyBar(){
      if (!stickyDocked) return;
      stickyDocked = false;
      stickyBar.classList.remove("docked");
      stickyBar.style.position = "";
      stickyBar.style.left = "";
      stickyBar.style.top = "";
      stickyBar.style.width = "";
      stickyBar.style.transform = "";
      stickyBar.style.transformOrigin = "";
      stickyPh.style.height = "0px";
      stickyHomeParent.insertBefore(stickyBar, stickyPh);
      measureStickyStartTop();
    }

    function positionDockedStickyBar(){
      if (!stickyDocked) return;
      const rect = scrollArea.getBoundingClientRect();
      const pad = getScrollAreaPadding();
      const left = rect.left + pad.pl;
      const top  = rect.top + pad.pt;
      const width = Math.max(260, rect.width - pad.pl - pad.pr);

      stickyBar.style.position = "fixed";
      stickyBar.style.transformOrigin = "top left";

      if (useTransformScale){
        stickyBar.style.left = (left / uiScale) + "px";
        stickyBar.style.top  = (top  / uiScale) + "px";
        stickyBar.style.width = (width / uiScale) + "px";
        stickyBar.style.transform = `scale(${uiScale})`;
      } else {
        stickyBar.style.left = left + "px";
        stickyBar.style.top  = top + "px";
        stickyBar.style.width = width + "px";
        stickyBar.style.transform = "";
      }
    }

    function updateSticky(forceRecalc = false){
      if (!stickyBar) return;
      const needDock = (IS_SAFARI || useTransformScale);

      if (forceRecalc && !stickyDocked){
        requestAnimationFrame(() => measureStickyStartTop());
      }

      if (!needDock){
        if (stickyDocked) undockStickyBar();
        return;
      }

      if (stickyStartTop == null || forceRecalc){
        if (stickyDocked) undockStickyBar();
        measureStickyStartTop();
      }

      const shouldDock = (scrollArea.scrollTop > (stickyStartTop || 0));
      if (shouldDock && !stickyDocked) dockStickyBar();
      if (!shouldDock && stickyDocked) undockStickyBar();
      if (stickyDocked) positionDockedStickyBar();
    }
    scrollArea.addEventListener("scroll", () => updateSticky(false), { passive: true });

    // ====== durations ======
    const durQueue = [];
    const durLoading = new Set();
    let durActive = 0;
    const DUR_CONCURRENCY = 2;
    let rerenderTimer = null;

    function scheduleRerender(){
      if (rerenderTimer) return;
      rerenderTimer = setTimeout(() => { rerenderTimer = null; render(); }, 120);
    }

    function requestDuration(it){
      const id = it.id;
      if (durs[id] > 0) return;
      if (durLoading.has(id)) return;
      durLoading.add(id);
      durQueue.push(it);
      pumpDurationQueue();
    }

    function pumpDurationQueue(){
      while (durActive < DUR_CONCURRENCY && durQueue.length){
        const it = durQueue.shift();
        durActive++;
        loadDurationFor(it).catch(() => {}).finally(() => {
          durActive--;
          pumpDurationQueue();
        });
      }
    }

    function loadDurationFor(it){
      return new Promise((resolve, reject) => {
        const a = new Audio();
        a.preload = "metadata";
        a.src = it.url;

        let done = false;

        const cleanup = () => {
          a.removeEventListener("loadedmetadata", onMeta);
          a.removeEventListener("error", onErr);
          try { a.src = ""; } catch {}
        };

        const finish = (ok, err) => {
          if (done) return;
          done = true;
          cleanup();
          durLoading.delete(it.id);
          ok ? resolve() : reject(err || new Error("metadata error"));
        };

        const onMeta = () => {
          const dur = a.duration;
          if (Number.isFinite(dur) && dur > 0){
            durs[it.id] = dur;
            saveMap(LS.durs, durs);
            scheduleRerender();
          }
          finish(true);
        };

        const onErr = () => finish(false, new Error("metadata error"));

        a.addEventListener("loadedmetadata", onMeta, { once: true });
        a.addEventListener("error", onErr, { once: true });

        setTimeout(() => { if (!done) finish(false, new Error("timeout")); }, 12000);
      });
    }

    // ====== download ======
    function makeProxyUrl(fileUrl, filename){
      const u = DL_PROXY + "?u=" + encodeURIComponent(fileUrl);
      return filename ? (u + "&f=" + encodeURIComponent(filename)) : u;
    }

    function clickDownload(href, filename){
      const a = document.createElement("a");
      a.href = href;
      a.rel = "noopener";
      a.target = "_blank";
      if (filename) a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function forceDownload(fileUrl, filename){
      const proxied = makeProxyUrl(fileUrl, filename);
      try{
        clickDownload(proxied, filename);
        return;
      }catch{}

      try{
        const res = await fetch(proxied, { mode: "cors", cache: "no-store" });
        if (!res.ok) throw new Error("fetch failed");
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        clickDownload(url, filename);
        setTimeout(() => URL.revokeObjectURL(url), 60_000);
      }catch{
        window.location.href = fileUrl;
      }
    }

    function buildDownloadUrl(identifier, name){
      const parts = (name || "").split("/").map(p => encodeURIComponent(p));
      return `https://archive.org/download/${identifier}/${parts.join("/")}`;
    }

    // ====== transcript url routing ======
    function __ensureSlashEnd(s){ s = String(s || ""); return s.endsWith("/") ? s : (s + "/"); }
    function __basesWithSubdir(bases, subdir){
      const sd = String(subdir || "").replace(/^\/+|\/+$/g, "");
      return (bases || []).map(b => __ensureSlashEnd(b) + sd + "/");
    }
    const __S2_SRT_BASES = __basesWithSubdir(SRT_BASES, TX_SUBDIR_S2);
    const __S2_TXT_BASES = __basesWithSubdir(TXT_BASES, TX_SUBDIR_S2);
    const __S3_SRT_BASES = __basesWithSubdir(SRT_BASES, TX_SUBDIR_S3);
    const __S3_TXT_BASES = __basesWithSubdir(TXT_BASES, TX_SUBDIR_S3);

    function buildSrtNameCandidates(it){
      const rawName = (it?.name || "").split("/").pop() || "";
      const decoded = decodeURIComponentSafe(rawName);

      const baseDecoded = decoded.replace(/\.(m4a|mp3)$/i, ".srt");
      const baseRaw     = rawName.replace(/\.(m4a|mp3)$/i, ".srt");

      const hasA = /^A\s+/i.test(baseDecoded);
      const aDecoded = hasA ? baseDecoded : ("A " + baseDecoded);
      const aRaw     = hasA ? baseRaw     : ("A " + baseRaw);
      const aUDecoded = hasA ? baseDecoded : ("A_" + baseDecoded);
      const aURaw     = hasA ? baseRaw     : ("A_" + baseRaw);
      const aDDecoded = hasA ? baseDecoded : ("A-" + baseDecoded);
      const aDRaw     = hasA ? baseRaw     : ("A-" + baseRaw);

      const altDecoded  = decoded + ".srt";
      const altRaw      = rawName + ".srt";

      const seen = new Set();
      const out = [];
      for (const n of [baseDecoded, baseRaw, aDecoded, aRaw, aUDecoded, aURaw, aDDecoded, aDRaw, altDecoded, altRaw]){
        const nn = String(n || "").trim();
        if (!nn) continue;
        if (seen.has(nn)) continue;
        seen.add(nn);
        out.push(nn);
      }
      return out;
    }

    function buildTxtNameCandidates(it){
      const rawName = (it?.name || "").split("/").pop() || "";
      const decoded = decodeURIComponentSafe(rawName);

      const baseDecoded = decoded.replace(/\.(m4a|mp3)$/i, ".txt");
      const baseRaw     = rawName.replace(/\.(m4a|mp3)$/i, ".txt");

      const hasA = /^A\s+/i.test(baseDecoded);
      const aDecoded  = hasA ? baseDecoded : ("A " + baseDecoded);
      const aRaw      = hasA ? baseRaw     : ("A " + baseRaw);
      const aUDecoded = hasA ? baseDecoded : ("A_" + baseDecoded);
      const aURaw     = hasA ? baseRaw     : ("A_" + baseRaw);
      const aDDecoded = hasA ? baseDecoded : ("A-" + baseDecoded);
      const aDRaw     = hasA ? baseRaw     : ("A-" + baseRaw);

      const altDecoded = decoded + ".txt";
      const altRaw     = rawName + ".txt";

      const seen = new Set();
      const out = [];
      for (const n of [baseDecoded, baseRaw, aDecoded, aRaw, aUDecoded, aURaw, aDDecoded, aDRaw, altDecoded, altRaw]){
        const nn = String(n || "").trim();
        if (!nn) continue;
        if (seen.has(nn)) continue;
        seen.add(nn);
        out.push(nn);
      }
      return out;
    }

    async function buildSrtUrlsForItem(it){
      const names = buildSrtNameCandidates(it);
      const urls = [];
      const bases = (it?.src === SRC_S2) ? __S2_SRT_BASES : (it?.src === SRC_S3) ? __S3_SRT_BASES : SRT_BASES;
      for (const name of names){
        for (const base of bases){
          urls.push(base + encodeURIComponent(name));
        }
      }
      return { urls, triedNames: names };
    }

    async function buildTxtUrlsForItem(it){
      const names = buildTxtNameCandidates(it);
      const urls = [];
      const bases = (it?.src === SRC_S2) ? __S2_TXT_BASES : (it?.src === SRC_S3) ? __S3_TXT_BASES : TXT_BASES;
      for (const name of names){
        for (const base of bases){
          urls.push(base + encodeURIComponent(name));
        }
      }
      return { urls, triedNames: names };
    }

    // ====== captions ======
    const CAPTION_MODES = ["cc", "CC", "CCx"];
    function readCaptionMode(){
      const raw = localStorage.getItem(LS.captionsMode) || "";
      if (CAPTION_MODES.includes(raw)) return raw;
      return "cc";
    }
    let captionMode = readCaptionMode();
    const srtCache = new Map();
    let srtCtrl = null;
    let activeCues = [];
    let lastCueIdx = -1;

    function isCaptionsOn(){ return !!captionMode; }
    function getCaptionMaxLines(){
      if (captionMode === "CC") return CAPTION_MAX_LINES_9;
      if (captionMode === "CCx") return CAPTION_MAX_LINES_13;
      return CAPTION_MAX_LINES;
    }
    function getCaptionTargetLines(){
      if (captionMode === "CC") return CAPTION_MAX_LINES_9;
      if (captionMode === "CCx") return CAPTION_MAX_LINES_13;
      return CAPTION_TARGET_LINES;
    }

    function setCaptionUi(){
      const setBtn = (btn, active) => {
        btn.classList.toggle("on", !!active);
        btn.setAttribute("aria-pressed", String(!!active));
      };
      setBtn(ccSmallBtn, captionMode === "cc");
      setBtn(ccMedBtn,   captionMode === "CC");
      setBtn(ccXBtn,     captionMode === "CCx");

      const on = isCaptionsOn();
      captionsEl.classList.toggle("hidden", !on);
      captionsEl.style.setProperty("--capLines", String(getCaptionMaxLines()));
      if (!on){
        captionsEl.innerHTML = "";
        captionsEl.classList.add("isEmpty");
      } else if (!captionsEl.innerHTML){
        captionsEl.textContent = "…";
        captionsEl.classList.add("isEmpty");
      }
      setTimeout(() => clampPlayerToViewport(), 0);
    }

    function stripSrtTags(s){ return (s || "").toString().replace(/<[^>]+>/g, ""); }
    function srtTimeToSec(raw){
      const s = String(raw || "").trim().replace(",", ".");
      const m = s.match(/^(\d{1,2}):(\d{2}):(\d{2})(\.\d+)?$/);
      if (!m) return null;
      const hh = Number(m[1]), mm = Number(m[2]), ss = Number(m[3]);
      const frac = Number(m[4] || "0");
      if (![hh,mm,ss,frac].every(Number.isFinite)) return null;
      return hh * 3600 + mm * 60 + ss + frac;
    }

    function parseSrtToCues(srtText){
      let t = (srtText || "").replace(/^\uFEFF/, "");
      t = t.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const blocks = t.split(/\n{2,}/g);

      const cues = [];
      for (const block of blocks){
        const lines = block.split("\n").map(x => x.trimEnd()).filter(x => x.trim().length > 0);
        if (!lines.length) continue;

        let timeIdx = 0;
        if (/^\d+$/.test(lines[0].trim()) && lines.length >= 2) timeIdx = 1;

        const timeLine = lines[timeIdx] || "";
        const tm = timeLine.match(/(.+?)\s*-->\s*(.+)/);
        if (!tm) continue;

        const start = srtTimeToSec(tm[1]);
        const end = srtTimeToSec((tm[2].split(/\s+/)[0]) || "");
        if (start == null || end == null || !(end > start)) continue;

        const text = stripSrtTags(lines.slice(timeIdx + 1).join("\n")).trim();
        if (!text) continue;

        cues.push({ start, end, text });
      }

      cues.sort((a,b) => a.start - b.start);
      return cues;
    }

    function findCueIdx(cues, t){
      if (!cues.length) return -1;
      let lo = 0, hi = cues.length - 1;
      while (lo <= hi){
        const mid = (lo + hi) >> 1;
        const c = cues[mid];
        if (t < c.start) hi = mid - 1;
        else if (t >= c.end) lo = mid + 1;
        else return mid;
      }
      return -1;
    }

    function splitCaptionLines(text){
      const t = (text || "").toString().replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      return t.split("\n").map(l => l.trimEnd()).filter(l => l.trim().length > 0);
    }

    function countLinesText(text){ return splitCaptionLines(text).length; }

    function composeCaptionParts(cues, idx){
      if (!cues || idx < 0 || idx >= cues.length) return [];

      const parts = [];
      const target = getCaptionTargetLines();
      const wide = getCaptionMaxLines() > CAPTION_MAX_LINES;

      if (wide){
        const preTarget = Math.max(2, Math.floor(target / 3));
        let preLines = 0;
        let p = idx - 1;
        const stack = [];
        while (p >= 0 && preLines < preTarget){
          const c = cues[p];
          const tt = c?.text || "";
          const n = countLinesText(tt);
          if (n > 0){
            stack.push({ isActive: false, text: tt, start: c.start, end: c.end });
            preLines += n;
          }
          p--;
        }
        stack.reverse().forEach(x => parts.push(x));
      } else if (idx > 0){
        const c = cues[idx - 1];
        parts.push({ isActive: false, text: c?.text || "", start: c.start, end: c.end });
      }

      {
        const c = cues[idx];
        parts.push({ isActive: true, text: c?.text || "", start: c.start, end: c.end });
      }

      let total = parts.reduce((a,p) => a + countLinesText(p.text), 0);
      let nidx = idx + 1;

      while (total < target && nidx < cues.length){
        const c = cues[nidx];
        const tt = c?.text || "";
        const n = countLinesText(tt);
        if (n > 0){
          parts.push({ isActive: false, text: tt, start: c.start, end: c.end });
          total += n;
        }
        nidx++;
      }

      return parts;
    }

    function trimLinesAroundActive(lines, maxLines){
      if (lines.length <= maxLines) return { lines, activeStart: -1, activeEnd: -1 };

      let activeStart = lines.findIndex(l => l.isActive);
      let activeEnd = lines.length - 1 - [...lines].reverse().findIndex(l => l.isActive);
      if (activeStart < 0) activeStart = activeEnd = Math.floor(lines.length / 2);

      let start = 0;
      let end = lines.length - 1;

      while ((end - start + 1) > maxLines){
        const distTop = activeStart - start;
        const distBot = end - activeEnd;
        if (distTop > distBot) start += 1;
        else end -= 1;
      }

      const sliced = lines.slice(start, end + 1);
      const newActiveStart = Math.max(0, activeStart - start);
      const newActiveEnd = Math.max(newActiveStart, activeEnd - start);

      return { lines: sliced, activeStart: newActiveStart, activeEnd: newActiveEnd };
    }

    // segment replay
    let segEndTime = null;
    let segResumeAfter = false;
    let segResumeTime = null;

    function armSegmentEnd(end, resumeAfter, resumeTime){
      segEndTime = (Number.isFinite(end) ? end : null);
      segResumeAfter = !!resumeAfter;
      segResumeTime = (Number.isFinite(resumeTime) ? resumeTime : null);
    }

    function maybeStopAtSegmentEnd(){
      if (segEndTime == null) return;
      const t = Number(playerEl.currentTime) || 0;
      if (t < (segEndTime - 0.03)) return;

      const resumeAfter = segResumeAfter;
      const resumeTime = segResumeTime;

      segEndTime = null;
      segResumeAfter = false;
      segResumeTime = null;

      if (resumeAfter){
        try{
          const dur = Number(playerEl.duration);
          const target = Number.isFinite(resumeTime) ? resumeTime : (t + 0.01);
          const safeTarget = Number.isFinite(dur) && dur > 0
            ? Math.min(Math.max(0, target), Math.max(0, dur - 0.05))
            : Math.max(0, target);

          playerEl.currentTime = safeTarget;
          const p = plyr.play();
          if (p && typeof p.catch === "function") p.catch(()=>{});
          return;
        }catch{}
      }
      try{ plyr.pause(); }catch{}
    }
    playerEl.addEventListener("timeupdate", maybeStopAtSegmentEnd);

    function playSegment(start, end){
      if (!Number.isFinite(start) || !Number.isFinite(end) || !(end > start)) return;
      const resumeAfter = !playerEl.paused;
      const resumeTime = end + 0.01;
      try{
        armSegmentEnd(end, resumeAfter, resumeTime);
        playerEl.currentTime = Math.max(0, start + 0.01);
        const p = plyr.play();
        if (p && typeof p.catch === "function") p.catch(()=>{});
      }catch{}
    }

    function renderCaptionLines(lines){
      if (!isCaptionsOn()) { captionsEl.innerHTML = ""; return; }
      const maxLines = getCaptionMaxLines();
      captionsEl.style.setProperty("--capLines", String(maxLines));
      const { lines: trimmed, activeStart, activeEnd } = trimLinesAroundActive(lines, maxLines);

      const out = [];
      for (let i = 0; i < trimmed.length; i++){
        const ln = trimmed[i];
        const isActive = !!ln.isActive;

        let dist = 0;
        if (!isActive){
          if (i < activeStart) dist = activeStart - i;
          else if (i > activeEnd) dist = i - activeEnd;
          else dist = 1;
        }

        const opacity = isActive ? 1 : Math.max(0.20, 0.92 - (dist * 0.12));
        const weight = isActive ? 750 : 500;

        const ds = Number.isFinite(ln.start) ? ` data-start="${ln.start}"` : "";
        const de = Number.isFinite(ln.end) ? ` data-end="${ln.end}"` : "";

        out.push(`<span class="capLine" style="opacity:${opacity.toFixed(2)};font-weight:${weight}"${ds}${de}>${escHtml(ln.text)}</span>`);
      }

      const html = out.join("<br>");
      captionsEl.innerHTML = html || "…";
      captionsEl.classList.toggle("isEmpty", !html);
      setTimeout(() => clampPlayerToViewport(), 0);
    }

    function renderCaptionInfo(text){
      if (!isCaptionsOn()) { captionsEl.innerHTML = ""; return; }
      captionsEl.textContent = text || "…";
      captionsEl.classList.add("isEmpty");
      setTimeout(() => clampPlayerToViewport(), 0);
    }

    function onCaptionsTimeupdate(){
      if (!isCaptionsOn()) return;
      if (!activeCues.length) return;

      const t = Number(playerEl?.currentTime) || 0;
      const idx = findCueIdx(activeCues, t);

      if (idx === -1){
        if (lastCueIdx === -1) renderCaptionInfo("…");
        return;
      }

      if (idx === lastCueIdx) return;
      lastCueIdx = idx;

      const parts = composeCaptionParts(activeCues, idx);
      const flat = [];
      for (const p of parts){
        for (const line of splitCaptionLines(p.text)){
          flat.push({ text: line, isActive: !!p.isActive, start: p.start, end: p.end });
        }
      }
      renderCaptionLines(flat);
    }
    playerEl.addEventListener("timeupdate", onCaptionsTimeupdate);

    captionsEl.addEventListener("click", (e) => {
      if (!isCaptionsOn()) return;
      if (!activeCues.length) return;
      const span = e.target && e.target.closest ? e.target.closest(".capLine") : null;
      if (!span) return;
      const s = Number(span.getAttribute("data-start"));
      const en = Number(span.getAttribute("data-end"));
      if (Number.isFinite(s) && Number.isFinite(en) && en > s){
        playSegment(s, en);
      }
    });

    async function loadSrtForItem(it){
      activeCues = [];
      lastCueIdx = -1;

      if (!isCaptionsOn()) return renderCaptionInfo("");
      if (!it) return renderCaptionInfo("Bir kayıt seç...");

      const cached = srtCache.get(it.id);
      if (cached){
        activeCues = cached;
        renderCaptionInfo("…");
        return onCaptionsTimeupdate();
      }

      renderCaptionInfo("Altyazı yükleniyor…");

      try { if (srtCtrl) srtCtrl.abort(); } catch {}
      srtCtrl = new AbortController();

      const built = await buildSrtUrlsForItem(it);
      const urls = built.urls;
      const triedNames = built.triedNames || [];
      let lastUrl = urls[0] || "";

      try{
        let cues = null;
        for (const u of urls){
          lastUrl = u;
          const res = await fetch(u, { cache: "no-store", signal: srtCtrl.signal });
          if (!res.ok) continue;
          const body = await res.text();
          const parsed = parseSrtToCues(body);
          if (parsed && parsed.length){ cues = parsed; break; }
        }
        if (!cues) throw new Error("srt not found");

        srtCache.set(it.id, cues);
        activeCues = cues;
        renderCaptionInfo("…");
        onCaptionsTimeupdate();
      }catch(err){
        if (err && err.name === "AbortError") return;
        if (SRT_DEBUG){

    async function fetchIaMetadata(identifier){
      const metaUrl = `https://archive.org/metadata/${encodeURIComponent(identifier)}`;
      const res = await fetch(metaUrl, { cache: FORCE_REFRESH ? "no-store" : "no-cache" });
      if (!res.ok) throw new Error("IA metadata okunamadı: " + identifier);
      return res.json();
    }

    function mapFilesToItems(identifier, src, files){
      return (files || [])
        .filter(f => {
          const name = (f.name || "").toLowerCase();
          if (!(name.endsWith(".m4a") || name.endsWith(".mp3"))) return false;
          if (!("source" in f)) return true;
          return (String(f.source).toLowerCase() === "original");
        })
        .filter(f => (src !== SRC_S3) ? true : !ia3IsBlockedByPrefix(f.name || ""))
        .map((f, idx) => {
          const name = f.name || "";
          const title = (f.title || "").trim() || decodeURIComponentSafe(name.split("/").pop() || name);
          const url = buildDownloadUrl(identifier, name);
          const localId = name || url || (title + "#" + idx);
          const id = src + "|" + localId;

          const txtCandidates = buildTxtNameCandidates({ name });
          const txtName = (txtCandidates && txtCandidates.length) ? txtCandidates[0] : decodeURIComponentSafe(name).replace(/\.(m4a|mp3)$/i, ".txt");

          const txtBase = (src === SRC_S2) ? __S2_TXT_BASES[0] : (src === SRC_S3) ? __S3_TXT_BASES[0] : TXT_BASES[0];
          const txtUrl = txtName ? (txtBase + encodeURIComponent(txtName)) : "";

          return { id, title, name, url, src, ia: identifier, txtName, txtUrl };
        });
    }

    const CACHE_TTL_MS = 24 * 60 * 60 * 1000;

    async function loadItems(){
      const cached = loadAny(LS.itemsCache);
      const cachedAt = Number(localStorage.getItem(LS.itemsCacheAt) || "0");
      const cacheFresh =
        !FORCE_REFRESH &&
        Array.isArray(cached) &&
        cached.length > 0 &&
        Number.isFinite(cachedAt) &&
        (Date.now() - cachedAt) < CACHE_TTL_MS;

      if (cacheFresh){
        items = cached;
        statusEl.textContent = "";
        setSortIcons();
        render();
        scheduleRefreshCounts(50);
      } else {
        statusEl.textContent = "Yükleniyor...";
      }

      try{
        const [j1, j2, j3] = await Promise.all([
          fetchIaMetadata(IA_IDENTIFIER_1),
          fetchIaMetadata(IA_IDENTIFIER_2),
          fetchIaMetadata(IA_IDENTIFIER_3),
        ]);

        const files1 = Array.isArray(j1.files) ? j1.files : [];
        const files2 = Array.isArray(j2.files) ? j2.files : [];
        const files3 = Array.isArray(j3.files) ? j3.files : [];

        const list = []
          .concat(mapFilesToItems(IA_IDENTIFIER_1, SRC_S1, files1))
          .concat(mapFilesToItems(IA_IDENTIFIER_2, SRC_S2, files2))
          .concat(mapFilesToItems(IA_IDENTIFIER_3, SRC_S3, files3));

        const newFp = itemsFingerprint(list);
        const oldFp = itemsFingerprint(items);
        const shouldUpdate = !cacheFresh || (newFp && newFp !== oldFp);

        if (shouldUpdate){
          items = list;
          localStorage.setItem(LS.itemsCacheAt, String(Date.now()));
          localStorage.setItem(LS.itemsCache, JSON.stringify(items));
          statusEl.textContent = items.length ? "" : "Kayıt bulunamadı.";
          setSortIcons();
          render();
          scheduleRefreshCounts(100);
        } else {
          localStorage.setItem(LS.itemsCacheAt, String(Date.now()));
        }
        updateSticky(true);
      }catch(err){
        console.error(err);
        if (!cacheFresh) statusEl.textContent = "Liste yüklenemedi.";
      }
    }

    // ====== visible list ======
    function getVisibleItems(){
      const q = foldTR((searchEl.value || "").trim());
      let arr = items.filter(it => {
        if (q && !foldTR(it.title).includes(q)) return false;
        if (filterFav && !favs[it.id]) return false;
        return true;
      });

      if (sortMode === "dur"){
        const dir = (durSortDir === "asc") ? 1 : -1;
        arr.sort((a,b) => {
          const ha = (durs[a.id] > 0);
          const hb = (durs[b.id] > 0);
          if (ha !== hb) return ha ? -1 : 1;
          if (ha && hb){
            const da = durs[a.id];
            const db = durs[b.id];
            if (da !== db) return (da - db) * dir;
          }
          return a.title.localeCompare(b.title, "tr");
        });
      } else if (sortMode === "date"){
        const dir = (dateSortDir === "asc") ? 1 : -1;
        arr.sort((a,b) => {
          const ta = parseEndDate(a);
          const tb = parseEndDate(b);
          const ha = (ta !== null);
          const hb = (tb !== null);
          if (ha !== hb) return ha ? -1 : 1;
          if (ha && hb && ta !== tb) return (ta - tb) * dir;
          return a.title.localeCompare(b.title, "tr");
        });
      } else if (sortMode === "play"){
        const dir = (playSortDir === "asc") ? 1 : -1;
        arr.sort((a,b) => {
          const ca = Number(globalPlayCounts[a.id]) || 0;
          const cb = Number(globalPlayCounts[b.id]) || 0;
          if (ca !== cb) return (ca - cb) * dir;
          return a.title.localeCompare(b.title, "tr");
        });
      } else if (sortMode === "download"){
        const dir = (dlSortDir === "asc") ? 1 : -1;
        arr.sort((a,b) => {
          const ca = Number(globalDownloadCounts[a.id]) || 0;
          const cb = Number(globalDownloadCounts[b.id]) || 0;
          if (ca !== cb) return (ca - cb) * dir;
          return a.title.localeCompare(b.title, "tr");
        });
      } else {
        arr.sort((a,b) => a.title.localeCompare(b.title, "tr"));
      }
      return arr;
    }

    // ====== player dragging ======
    function restorePlayerPos(){
      try{
        const s = JSON.parse(localStorage.getItem(LS.pos) || "null");
        if (!s) return;
        if (typeof s.x !== "number" || typeof s.y !== "number") return;
        fp.style.left = s.x + "px";
        fp.style.top  = s.y + "px";
        fp.style.bottom = "auto";
        fp.style.right  = "auto";
        clampPlayerToViewport();
      }catch{}
    }
    function savePlayerPos(x,y){ localStorage.setItem(LS.pos, JSON.stringify({ x, y })); }
    function getPlayerRect(){ return fp.getBoundingClientRect(); }
    function getPlayerPosPx(){
      const left = parseFloat(fp.style.left);
      const top  = parseFloat(fp.style.top);
      if (Number.isFinite(left) && Number.isFinite(top)) return { left, top };
      const r = getPlayerRect();
      return { left: r.left, top: r.top };
    }
    function getPlayerBoundsPx(){
      const { vw, vh } = getViewportWH();
      const r = getPlayerRect();
      const w = r.width;
      const h = r.height;

      const keepX = Math.max(70, Math.min(w - 16, 180));
      const keepY = Math.max(56, Math.min(h - 16, 120));
      const capH = (isCaptionsOn() && !captionsEl.classList.contains("hidden"))
        ? captionsEl.getBoundingClientRect().height
        : 0;

      const minX = -w + keepX;
      const maxX = vw - keepX;
      const minY = -h + keepY + capH;
      const maxY = vh - keepY;

      return { minX, maxX, minY, maxY };
    }
    function clampPlayerToViewport(){
      const { minX, maxX, minY, maxY } = getPlayerBoundsPx();
      const cur = getPlayerPosPx();
      const nx = Math.min(maxX, Math.max(minX, cur.left));
      const ny = Math.min(maxY, Math.max(minY, cur.top));
      fp.style.left = nx + "px";
      fp.style.top  = ny + "px";
      fp.style.right = "auto";
      fp.style.bottom = "auto";
      savePlayerPos(nx, ny);
    }

    const DRAG_IGNORE_SELECTOR =
      "button, a, input, textarea, select, option, " +
      ".speedWrap, .speedCtlBtn, .miniBtn, " +
      ".plyr__controls, .plyr__control, .plyr__progress, .plyr__seek, .plyr__volume, .plyr__time, .plyr__menu";
    function shouldStartDrag(target){ return !(target && target.closest && target.closest(DRAG_IGNORE_SELECTOR)); }

    let dragging = false;
    let startClientX = 0, startClientY = 0;
    let startLeft = 0, startTop = 0;

    fpHeader.addEventListener("pointerdown", (e) => {
      if (!shouldStartDrag(e.target)) return;
      dragging = true;
      fpHeader.setPointerCapture(e.pointerId);
      fpHeader.style.cursor = "grabbing";
      startClientX = e.clientX;
      startClientY = e.clientY;
      const cur = getPlayerPosPx();
      startLeft = cur.left;
      startTop  = cur.top;
      fp.style.left = startLeft + "px";
      fp.style.top  = startTop + "px";
      fp.style.bottom = "auto";
      fp.style.right  = "auto";
    });

    fpHeader.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - startClientX;
      const dy = e.clientY - startClientY;
      const { minX, maxX, minY, maxY } = getPlayerBoundsPx();
      const nx = Math.min(maxX, Math.max(minX, startLeft + dx));
      const ny = Math.min(maxY, Math.max(minY, startTop  + dy));
      fp.style.left = nx + "px";
      fp.style.top  = ny + "px";
      savePlayerPos(nx, ny);
    });

    function endDrag(pointerId){
      if (!dragging) return;
      dragging = false;
      fpHeader.style.cursor = "grab";
      try { fpHeader.releasePointerCapture(pointerId); } catch {}
      clampPlayerToViewport();

    function escapeForRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
    function buildHighlightedHtml(text, ranges, activeIdx){
      if (!ranges.length) return escHtml(text);
      const parts = [];
      let last = 0;
      for (let i=0; i<ranges.length; i++){
        const r = ranges[i];
        const a = Math.max(0, r[0]);
        const b = Math.max(a, r[1]);
        if (a > last) parts.push(escHtml(text.slice(last, a)));
        const cls = (i === activeIdx) ? "txMark active" : "txMark";
        parts.push(`<span class="${cls}" data-mi="${i}">${escHtml(text.slice(a, b))}</span>`);
        last = b;
      }
      if (last < text.length) parts.push(escHtml(text.slice(last)));
      return parts.join("");
    }

    function computeMatches(text, q){
      const out = [];
      if (!q) return out;
      const re = new RegExp(escapeForRegex(q), "gi");
      let m;
      while ((m = re.exec(text))){
        const a = m.index;
        const b = a + (m[0] || "").length;
        if (b > a) out.push([a, b]);
        if (out.length >= 2000) break;
        if (m[0].length === 0) re.lastIndex++;
      }
      return out;
    }

    function scrollToActiveMatch(){
      const el = txContentEl.querySelector(".txMark.active");
      if (!el) return;
      try{ el.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" }); }
      catch{ el.scrollIntoView(); }
    }

    function setActiveMatch(idx){
      if (!txMatches.length) return;
      txActiveMatch = ((idx % txMatches.length) + txMatches.length) % txMatches.length;
      txMatchCountEl.textContent = `${txActiveMatch + 1}/${txMatches.length}`;

      const old = txContentEl.querySelector(".txMark.active");
      if (old) old.classList.remove("active");
      const next = txContentEl.querySelector(\`.txMark[data-mi="\${txActiveMatch}"]\`);
      if (next){
        next.classList.add("active");
        scrollToActiveMatch();
      } else {
        txContentEl.innerHTML = buildHighlightedHtml(txPlainText, txMatches, txActiveMatch);
        setTimeout(() => scrollToActiveMatch(), 0);
      }
    }

    function applyTxSearch(){
      const q = (txSearchInput.value || "").trim();
      if (!q){ clearTxSearchUI(); return; }
      txMatches = computeMatches(txPlainText, q);
      txActiveMatch = txMatches.length ? 0 : -1;

      txPrevMatchBtn.disabled = txMatches.length < 2;
      txNextMatchBtn.disabled = txMatches.length < 2;

      txMatchCountEl.textContent = txMatches.length ? \`1/\${txMatches.length}\` : \`0/0\`;
      txContentEl.innerHTML = buildHighlightedHtml(txPlainText, txMatches, txActiveMatch);
      if (txMatches.length) setTimeout(() => scrollToActiveMatch(), 0);
    }

    });

    txSearchInput.addEventListener("input", () => {
      clearTimeout(txSearchTimer);
      txSearchTimer = setTimeout(applyTxSearch, 180);
    });

    txPrevMatchBtn.addEventListener("click", () => setActiveMatch(txActiveMatch - 1));
    txNextMatchBtn.addEventListener("click", () => setActiveMatch(txActiveMatch + 1));

    async function copyToClipboard(text){
      if (!text) return false;
      try{
        await navigator.clipboard.writeText(text);
        return true;
      }catch{}
      try{
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        ta.style.top = "-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        return !!ok;
      }catch{
        return false;
      }
    }

    txCopyBtn.addEventListener("click", async () => {
      const ok = await copyToClipboard(txPlainText);
      txInfoEl.textContent = ok ? "Kopyalandı." : "Kopyalanamadı.";
      setTimeout(() => { if (txCurrent) updateTxInfo(txCurrent); }, 900);
    });

    txDownloadBtn.addEventListener("click", () => {
      if (!txCurrent || !txCurrent.txtUrl) return;
      const filename = (txCurrent.txtName || "").split("/").pop() || "transkript.txt";
      forceDownload(txCurrent.txtUrl, filename);
    });

    function updateTxInfo(it){
      const file = (it?.txtName || "").split("/").pop() || "—";
      txInfoEl.textContent = file ? \`TXT: \${file}\` : "—";
    }

    async function fetchTranscriptText(it){
      const cached = txCache.get(it.id);
      if (cached && (Date.now() - cached.at) < TX_CACHE_TTL_MS) return cached.text;

      const built = await buildTxtUrlsForItem(it);
      const urls = [];
      const seen = new Set();

      for (const u of [it?.txtUrl, ...(built?.urls || [])]){
        const uu = String(u || "").trim();
        if (!uu) continue;
        if (seen.has(uu)) continue;
        seen.add(uu);
        urls.push(uu);
      }

      let lastErr = null;
      for (const url of urls){
        try{
          const res = await fetch(url, { cache: "no-cache" });
          if (!res.ok) throw new Error("txt fetch failed: " + res.status);
          const text = await res.text();

          try{
            const u = new URL(url, location.href);
            const fn = decodeURIComponentSafe((u.pathname || "").split("/").pop() || "");
            if (fn) it.txtName = fn;
          }catch{}
          it.txtUrl = url;

          txCache.set(it.id, { text, at: Date.now() });
          return text;
        }catch(err){
          lastErr = err;
        }
      }
      throw (lastErr || new Error("txt fetch failed"));
    }

    async function openTranscriptFor(it){
      if (!it) return;
      txCurrent = it;
      openTranscript();

      txTitleEl.textContent = it.title || "Transkript";
      updateTxInfo(it);

      txCopyBtn.disabled = true;
      txDownloadBtn.disabled = true;
      txContentEl.textContent = "Yükleniyor…";
      txPlainText = "";
      clearTxSearchUI();

      try{
        const t = await fetchTranscriptText(it);
        txPlainText = t || "";
        txCopyBtn.disabled = !txPlainText;
        updateTxInfo(it);
        txDownloadBtn.disabled = false;
        clearTxSearchUI();
      }catch{
        txContentEl.textContent = "TXT yüklenemedi.";
        txCopyBtn.disabled = true;
      }
    }

    function toggleTranscriptFromPlayer(){
      if (txOpen){ closeTranscript(); return; }
      const it = items.find(x => x.id === activeId) || items.find(x => x.id === selectedId) || null;
      if (!it){
        openTranscript();
        txTitleEl.textContent = "Transkript";
        txInfoEl.textContent = "—";
        txPlainText = "";
        txContentEl.textContent = "Bir kayıt seç...";
        txCopyBtn.disabled = true;
        txDownloadBtn.disabled = true;
        return;
      }
      openTranscriptFor(it).catch(()=>{});
    }
    fpTxtBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleTranscriptFromPlayer(); });

    // ====== search / reset / fav ======
    filterFavBtn.addEventListener("click", () => { filterFav = !filterFav; render(); });

    resetBtn.addEventListener("click", () => {
      filterFav = false;
      searchEl.value = "";
      sortMode = "title";
      dateSortDir = "desc";
      localStorage.setItem(LS.sortMode, sortMode);
      localStorage.setItem(LS.sortDirDate, dateSortDir);
      setSortIcons();
      render();
    });

    const SEARCH_DEBOUNCE_MS = 900;
    let searchTimer = null;
    searchEl.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => render(), SEARCH_DEBOUNCE_MS);
    });
    searchEl.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      clearTimeout(searchTimer);
      render();
    });

    // ====== keyboard ======
    function isTypingTarget(){
      const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
      return (tag === "input" || tag === "textarea");
    }
    document.addEventListener("keydown", (e) => {
      if (isTypingTarget()) return;
      if (e.code === "Space"){ e.preventDefault(); plyr.togglePlay(); }
      else if (e.code === "ArrowLeft"){ e.preventDefault(); playPrev(); }
      else if (e.code === "ArrowRight"){ e.preventDefault(); playNext(); }
      else if (e.key === "Escape"){ if (txOpen) closeTranscript(); }
    });

    // ====== init ======
    setZoomUI();
    setSpeedUI(1);
    setSortIcons();
    restoreSpeed();
    restoreZoom();
    restorePlayerPos();
    setCaptionUi();
    requestAnimationFrame(() => { measureStickyStartTop(); updateSticky(true); });
    setTimeout(clampPlayerToViewport, 0);
    loadItems();
    setTimeout(() => scheduleRefreshCounts(200), 700);
  </script>
</body>
</html>
